<!doctype html>
<script src="/WebFront.js"></script>
<script type="module">
// Values match LifecycleStage in FrontendLifecycle.cpp. Diagnostics must not change the test outcome.
const stage = { policyDestination: 7 };
const reportStage = value => {
    try { webFront.cppFunction("lifecycleStage")(value).catch(() => {}); } catch { /* best effort */ }
};
try {
    await webFront.ready;
    reportStage(stage.policyDestination);
    await webFront.cppFunction(location.search === '?popup' ? 'policyEscaped' : 'policyNavigated')();
} catch (error) {
    console.error('Policy destination could not report its result', error);
} finally {
    // C++ requires the report, so a failed bridge returns a nonzero test status.
    window.close();
    reportStage(11);
}
</script>
