name: Build and Test

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  desktop:
    name: ${{ matrix.name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC / WebKitGTK
            os: ubuntu-24.04
            options: -DWEBFRONT_EMBED_WEBKITGTK=ON -DWEBFRONT_WEBTEST_FRONTEND=WebKitGTK
          - name: Windows MSVC / WebView2
            os: windows-2025
            options: -DWEBFRONT_EMBED_WEBVIEW2=ON -DWEBFRONT_WEBTEST_FRONTEND=WebView2
          - name: macOS Apple Clang / WKWebView
            os: macos-26
            options: -DWEBFRONT_EMBED_WKWEBVIEW=ON -DWEBFRONT_WEBTEST_FRONTEND=WKWebView
    runs-on: ${{ matrix.os }}
    env:
      # Trusted repository fixtures, on hosted Linux runners without user namespaces.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/assets/package-lock.json
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.4'
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup GCC
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-gcc@v1.3
        with:
          version: 16
      - name: Install native Linux engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkitgtk-6.0-dev pkg-config xvfb
      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Prepare offline developer fixtures
        run: |
          npm ci --prefix tools/assets --ignore-scripts
          node tools/developer/build.mjs build-developer-environment
          node tools/developer/fixtures.mjs build-developer-environment
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWEBFRONT_EMBED_CEF=OFF -DENABLE_TESTING=ON
          -DENABLE_CACHE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          ${{ matrix.options }}
          -DWEBFRONT_DEVELOPER_FIXTURES=${{ github.workspace }}/build-developer-environment
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Ensure WebView2 Evergreen runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-WebView2Runtime {
            $runtimeRoots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
            $runtimeRoots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Filter msedgewebview2.exe -Recurse }
          }
          $runtime = Get-WebView2Runtime
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2EvergreenBootstrapper.exe'
            # Evergreen intentionally follows Microsoft's mutable bootstrapper redirect.
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
              throw 'WebView2 bootstrapper must have a valid Microsoft signature'
            }
            $install = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($install.ExitCode -ne 0) { throw "WebView2 runtime installation failed: $($install.ExitCode)" }
            $runtime = Get-WebView2Runtime
          }
          if (-not $runtime) { throw 'WebView2 runtime executable not found after provisioning' }
          foreach ($executable in $runtime) {
            $version = $executable.VersionInfo.FileVersion
            if (-not $version) { throw "WebView2 runtime version is missing: $($executable.FullName)" }
            Write-Host "WebView2 runtime $version at $($executable.FullName)"
          }
      - name: Test C++ and native browser integration
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ runner.os }}
          path: build/Testing/Temporary/LastTest.log

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    name: Linux Clang (${{ matrix.sanitizer }})
    env:
      CC: clang-23
      CXX: clang++-23
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-extended-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-extended-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.4'
      - name: Install Clang 23 and sanitizer runtimes
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 libclang-rt-23-dev libc++-23-dev libc++abi-23-dev
      - name: Restrict address-space randomization for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # libc++ keeps retry-after-exception in call_once usable under TSan.
      - name: Configure hardened sanitizer tests
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DWEBFRONT_EMBED_CEF=OFF -DWEBFRONT_BUILD_EXAMPLES=OFF -DENABLE_TESTING=ON -DENABLE_CACHE=OFF
          ${{ matrix.sanitizer == 'thread' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DENABLE_SANITIZER_THREAD=ON' || '-DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DENABLE_FUZZING=ON' }}
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Run full CEF-off suite
        run: ctest --test-dir build-sanitizers --output-on-failure --no-tests=error
      - name: Fuzz decoders (30 seconds each)
        if: matrix.sanitizer == 'address-undefined'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sanitizers/fuzz/artifacts
          for decoder in messages http websocket gzip; do
            build-sanitizers/fuzz/fuzz_$decoder build-sanitizers/fuzz/corpus/$decoder \
              -max_total_time=30 -timeout=5 -max_len=65536 -rss_limit_mb=1024 \
              -artifact_prefix=build-sanitizers/fuzz/artifacts/$decoder-
          done
      - name: Upload fuzz findings
        if: failure() && matrix.sanitizer == 'address-undefined'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: build-sanitizers/fuzz/artifacts/
          if-no-files-found: ignore

  web-integration:
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    # Clang 19+ expands stdexec attributes that GCC leaves empty, so only Clang catches CEF macro clashes (#243)
    name: Ubuntu CEF Jasmine integration${{ matrix.compiler == 'clang' && ' (Clang)' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-extended-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-extended-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.4'

      - name: Install Clang 23
        if: matrix.compiler == 'clang'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23
          echo "CC=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare offline developer environment and starter fixtures
        run: |
          npm ci --prefix tools/assets --ignore-scripts
          node tools/developer/build.mjs build-developer-environment
          node tools/developer/fixtures.mjs build-developer-environment
      - name: Configure CEF integration build
        run: cmake . -B ${{github.workspace}}/build-cef -DCMAKE_BUILD_TYPE=Release -DWEBFRONT_EMBED_CEF=ON -DWEBFRONT_BUILD_EXAMPLES=OFF -DENABLE_TESTING=ON -DWEBFRONT_DEVELOPER_FIXTURES=${{github.workspace}}/build-developer-environment

      - name: Build browser test
        run: cmake --build ${{github.workspace}}/build-cef --target webtest developer_integration --parallel 2

      - name: Run Jasmine bridge test
        run: ctest --test-dir ${{github.workspace}}/build-cef -L web-integration --output-on-failure --no-tests=error

  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Linux GCC coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.4'
      - uses: egor-tensin/setup-gcc@v1.3
        with:
          version: 16
      - run: sudo apt-get update && sudo apt-get install -y lcov
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWEBFRONT_EMBED_CEF=OFF -DENABLE_TESTING=ON -DWEBFRONT_BUILD_EXAMPLES=OFF -DENABLE_COVERAGE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Collect Coverage
        working-directory: ${{github.workspace}}/build
        run: |
          lcov --gcov-tool gcov-16 --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/examples/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ${{github.workspace}}/build/coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
