name: Build and Test

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      repeat_desktop_tests:
        description: 'Also run the desktop matrix, repeating the complete CTest suite three times'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push to a release branch: its coverage upload must complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  SCCACHE_GHA_ENABLED: 'true'

# Third-party actions are pinned to commit SHAs; GitHub-owned actions/* use version tags.
jobs:
  # The Linux toolchain image is tagged with the hash of its Dockerfile and built only when that tag is missing from ghcr.io,
  # so a change of the Dockerfile is validated by the very run that carries it. A pull request from a fork cannot push it
  # (read-only token): its Linux job then fails at the pull, which a maintainer re-run on a branch of this repository fixes.
  linux-image:
    if: github.event_name != 'workflow_dispatch' || inputs.repeat_desktop_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Name the image after its Dockerfile
        id: tag
        run: |
          hash=$(sha256sum .github/docker/linux-ci.Dockerfile | cut -c1-16)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/linux-ci:$hash" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the image if its tag does not exist
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo "${{ steps.tag.outputs.image }} already exists"
          else
            docker build -f .github/docker/linux-ci.Dockerfile -t "${{ steps.tag.outputs.image }}" .github/docker
            docker push "${{ steps.tag.outputs.image }}"
          fi

  desktop:
    needs: linux-image
    permissions:
      contents: read
      packages: read
    # Manual runs add extended checks; stability checks opt into desktops.
    if: github.event_name != 'workflow_dispatch' || inputs.repeat_desktop_tests
    # No `name:` expression: a skipped matrix job would display it unevaluated.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-gcc-webkitgtk, windows-msvc-webview2, macos-clang-wkwebview]
        include:
          - platform: linux-gcc-webkitgtk
            os: ubuntu-26.04
            use_image: true
            build_type: Debug
            test_env: {WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'}
            options: -DWEBFRONT_EMBED_WEBKITGTK=ON -DWEBFRONT_WEBTEST_FRONTEND=WebKitGTK -DENABLE_COVERAGE=ON
          - platform: windows-msvc-webview2
            os: windows-2025
            build_type: Release
            test_env: {}
            options: -DWEBFRONT_EMBED_WEBVIEW2=ON -DWEBFRONT_WEBTEST_FRONTEND=WebView2
          - platform: macos-clang-wkwebview
            os: macos-26
            build_type: Release
            test_env: {}
            options: -DWEBFRONT_EMBED_WKWEBVIEW=ON -DWEBFRONT_WEBTEST_FRONTEND=WKWebView
    runs-on: ${{ matrix.os }}
    # Only the Linux job runs in the prebuilt toolchain image; an empty value means no container.
    container: ${{ matrix.use_image && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}},"options":"--shm-size=1g"}}', needs.linux-image.outputs.image, github.actor, github.token)) || '' }}
    steps:
      - uses: actions/checkout@v7
      # No step of a build or of its tests needs a JavaScript runtime or package manager: the runner has none from here on.
      - uses: ./.github/actions/remove-node
      - uses: ./.github/actions/setup-cmake
        with:
          version: '4.4.4'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/unit/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      # GCC 16, WebKitGTK, lcov, Ninja and Xvfb come from the container image (.github/docker/linux-ci.Dockerfile).
      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest
      - name: Verify compiler cache launcher
        shell: bash
        run: |
          command -v sccache
          sccache --version
      # ENABLE_CACHE controls automatic ccache discovery; the explicit sccache launcher stays enabled.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DWEBFRONT_EMBED_CEF=OFF -DENABLE_TESTING=ON
          -DENABLE_CACHE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          ${{ matrix.options }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      - name: Ensure WebView2 Evergreen runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-WebView2Runtime {
            $runtimeRoots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
            $runtimeRoots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Filter msedgewebview2.exe -Recurse }
          }
          $runtime = Get-WebView2Runtime
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2EvergreenBootstrapper.exe'
            # Evergreen intentionally follows Microsoft's mutable bootstrapper redirect.
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
              throw 'WebView2 bootstrapper must have a valid Microsoft signature'
            }
            $install = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($install.ExitCode -ne 0) { throw "WebView2 runtime installation failed: $($install.ExitCode)" }
            $runtime = Get-WebView2Runtime
          }
          if (-not $runtime) { throw 'WebView2 runtime executable not found after provisioning' }
          foreach ($executable in $runtime) {
            $version = $executable.VersionInfo.FileVersion
            if (-not $version) { throw "WebView2 runtime version is missing: $($executable.FullName)" }
            Write-Host "WebView2 runtime $version at $($executable.FullName)"
          }
      - name: Test C++ and native browser integration
        # Only Linux trusted fixtures need the sandbox opt-out on hosted runners.
        env: ${{ matrix.test_env }}
        run: >-
          cmake -DBUILD_DIR=${{ github.workspace }}/build -DCONFIG=${{ matrix.build_type }}
          -DREPEAT=${{ github.event_name == 'workflow_dispatch' && inputs.repeat_desktop_tests && '3' || '1' }}
          -P test/cmake/RunTestSuite.cmake
      - name: Collect coverage
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          # lcov 2 on Ubuntu 26.04 rejects the benign line/function hit inconsistencies GCC emits for templates.
          lcov --ignore-errors inconsistent,inconsistent --gcov-tool gcov-16 --capture --directory . --output-file coverage.info
          lcov --ignore-errors inconsistent,inconsistent --remove coverage.info '/usr/*' '*/examples/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Collect macOS browser crash diagnostics
        if: failure() && runner.os == 'macOS'
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p build/diagnostics
          /usr/bin/log show --last 15m --style compact \
            --predicate 'process CONTAINS "WebKit" OR process == "developer_integration"' \
            > build/diagnostics/webkit.log 2>&1 || true
          shopt -s nullglob
          for directory in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            for report in "$directory"/*WebKit* "$directory"/*WebContent* "$directory"/*developer_integration*; do
              if [ -f "$report" ]; then cp "$report" build/diagnostics/; fi
            done
          done
      - name: Retain test timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ runner.os }}
          path: |
            build/test-results-*.xml
            build/Testing/Temporary/LastTest.log
            build/diagnostics/
          if-no-files-found: ignore

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    env:
      CC: clang-23
      CXX: clang++-23
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-extended-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-extended-${{ runner.os }}-
      - uses: ./.github/actions/remove-node
      - uses: ./.github/actions/setup-cmake
        with:
          version: '4.4.4'
      - name: Install Clang 23 and sanitizer runtimes
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 libclang-rt-23-dev libc++-23-dev libc++abi-23-dev zlib1g-dev
      - name: Restrict address-space randomization for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # libc++ keeps retry-after-exception in call_once usable under TSan.
      - name: Configure hardened sanitizer tests
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DWEBFRONT_EMBED_CEF=OFF -DWEBFRONT_BUILD_EXAMPLES=OFF -DENABLE_TESTING=ON -DENABLE_CACHE=OFF
          ${{ matrix.sanitizer == 'thread' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DENABLE_SANITIZER_THREAD=ON' || '-DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DENABLE_FUZZING=ON -DWEBFRONT_GZIP_DIFFERENTIAL=ON' }}
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Run full CEF-off suite
        run: >-
          ctest --test-dir build-sanitizers --output-on-failure --no-tests=error --parallel 4
          --output-junit "${{ github.workspace }}/build-sanitizers/test-results.xml"
      - name: Compare generated gzip streams against zlib
        timeout-minutes: 5
        if: matrix.sanitizer == 'address-undefined'
        run: |
          python3 test/fuzz/GenerateGzipCorpus.py build-sanitizers/gzip-corpus
          build-sanitizers/test/unit/gzip_differential build-sanitizers/gzip-corpus
      - name: Retain test timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.sanitizer }}
          path: |
            build-sanitizers/test-results.xml
            build-sanitizers/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Fuzz decoders (30 seconds each)
        if: matrix.sanitizer == 'address-undefined'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sanitizers/test/fuzz/artifacts
          for decoder in messages http websocket gzip; do
            build-sanitizers/test/fuzz/fuzz_$decoder build-sanitizers/test/fuzz/corpus/$decoder \
              -max_total_time=30 -timeout=5 -max_len=65536 -rss_limit_mb=1024 \
              -artifact_prefix=build-sanitizers/test/fuzz/artifacts/$decoder-
          done
          build-sanitizers/test/fuzz/fuzz_gzip_differential build-sanitizers/test/fuzz/corpus/gzip \
            -max_total_time=30 -timeout=5 -max_len=65536 -rss_limit_mb=1024 \
            -artifact_prefix=build-sanitizers/test/fuzz/artifacts/gzip-differential-
      - name: Upload fuzz findings
        if: failure() && matrix.sanitizer == 'address-undefined'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: build-sanitizers/test/fuzz/artifacts/
          if-no-files-found: ignore

  web-integration:
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    # Clang 19+ expands stdexec attributes that GCC leaves empty, so only Clang catches CEF macro clashes (#243)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-extended-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-extended-${{ runner.os }}-
      - uses: ./.github/actions/remove-node

      - uses: ./.github/actions/setup-cmake
        with:
          version: '4.4.4'

      - name: Install Clang 23
        if: matrix.compiler == 'clang'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23
          echo "CC=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"

      # The registry packages and the pinned bootstrap environment are downloaded and verified here; wf then builds the rest.
      - name: Configure CEF integration build
        run: cmake . -B ${{github.workspace}}/build-cef -DCMAKE_BUILD_TYPE=Release -DWEBFRONT_EMBED_CEF=ON -DWEBFRONT_BUILD_EXAMPLES=OFF -DENABLE_TESTING=ON

      - name: Build browser test
        run: cmake --build ${{github.workspace}}/build-cef --target webtest developer_integration webfront-wf --parallel 2

      # Everything is provisioned by the configure step: the tests must not reach the public network.
      - name: Cut the public network
        run: |
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT ! -o lo -j REJECT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -A OUTPUT ! -o lo -j REJECT
      - name: Run Jasmine bridge test
        run: >-
          ctest --test-dir ${{github.workspace}}/build-cef -L web-integration --output-on-failure --no-tests=error --parallel 4
          --output-junit "${{ github.workspace }}/build-cef/test-results.xml"
      - name: Restore the network
        if: always()
        run: |
          sudo iptables -F OUTPUT
          sudo ip6tables -F OUTPUT
      - name: Retain test timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-cef-${{ matrix.compiler }}
          path: |
            build-cef/test-results.xml
            build-cef/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
