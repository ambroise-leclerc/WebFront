name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master develop ]

env:
  BUILD_TYPE: Release
  GIST_ID: 317c22bfe80b2b51663187fbebfba533

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows MSVC",
              os: windows-2025,
              compiler: msvc,
              coverage: false
            }
          - {
              name: "Ubuntu GCC with Coverage",
              os: ubuntu-24.04,
              compiler: gcc,
              coverage: true
            }
          - {
              name: "Ubuntu Clang",
              os: ubuntu-24.04,
              compiler: clang,
              coverage: false
            }
          - {
              name: "macOS (Apple Silicon)",
              os: macos-26,
              compiler: appleClang,
              coverage: false
            }
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 22
        if: matrix.config.compiler == 'clang'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 lldb-22
          echo "CC=clang-22" >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1.3
        with:
          version: 16
        if: matrix.config.compiler == 'gcc'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
        if: matrix.config.compiler == 'appleClang'

      - name: Install Coverage Tools
        if: matrix.config.coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
        
      - name: Config & Build
        run: |
          cmake . -B ${{github.workspace}}/build -DWEBFRONT_EMBED_CEF=OFF ${{ matrix.config.coverage && '-DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON' || '' }}
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 1
  
      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --verbose -C ${{env.BUILD_TYPE}}

      - name: Rerun Failed Tests (if any)
        if: failure()
        working-directory: ${{github.workspace}}/build
        run: ctest --rerun-failed --output-on-failure -C ${{env.BUILD_TYPE}}

      - name: Collect Coverage
        if: matrix.config.coverage
        working-directory: ${{github.workspace}}/build
        run: |
          lcov --gcov-tool gcov-16 --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/src/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload Coverage
        if: matrix.config.coverage
        uses: codecov/codecov-action@v5
        with:
          files: ${{github.workspace}}/build/coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set Badge Info
        if: always() && github.ref == 'refs/heads/master'
        id: badge
        run: |
          # Set badge label
          echo "label=${{ matrix.config.name }}" >> $GITHUB_OUTPUT
          
          # Set badge color
          case "${{ job.status }}" in
            "success") echo "color=2EA043" >> $GITHUB_OUTPUT ;;
            "failure") echo "color=E6484F" >> $GITHUB_OUTPUT ;;
            *) echo "color=DBAB0A" >> $GITHUB_OUTPUT ;;
          esac
          
          # Set filename
          echo "filename=${{ matrix.config.os }}-${{ matrix.config.compiler }}.json" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update Gist
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIST_SECRET }}
          script: |
            const filename = '${{ steps.badge.outputs.filename }}';
            const content = {
              schemaVersion: 1,
              label: '${{ steps.badge.outputs.label }}',
              message: '${{ job.status }}',
              color: '${{ steps.badge.outputs.color }}'
            };
            
            try {
              await github.rest.gists.update({
                gist_id: process.env.GIST_ID,
                files: {
                  [filename]: {
                    content: JSON.stringify(content)
                  }
                }
              });
            } catch (error) {
              core.error(`Failed to update gist: ${error.message}`);
              if (error.response) {
                core.error(`Status: ${error.response.status}`);
                core.error(`Response: ${JSON.stringify(error.response.data)}`);
              }
              throw error;
            }

      - name: Update Badge
        if: always() && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.GIST_ID }}
          filename: ${{ steps.badge.outputs.filename }}
          label: ${{ steps.badge.outputs.label }}
          message: ${{ job.status }}
          color: ${{ steps.badge.outputs.color }}

  web-integration:
    runs-on: ubuntu-24.04
    name: Ubuntu CEF Jasmine integration
    steps:
      - uses: actions/checkout@v5

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Configure CEF integration build
        run: cmake . -B ${{github.workspace}}/build-cef -DCMAKE_BUILD_TYPE=Release -DWEBFRONT_EMBED_CEF=ON -DENABLE_TESTING=ON

      - name: Build browser test
        run: cmake --build ${{github.workspace}}/build-cef --target webtest --parallel 1

      - name: Run Jasmine bridge test
        run: ctest --test-dir ${{github.workspace}}/build-cef -L web-integration --output-on-failure
