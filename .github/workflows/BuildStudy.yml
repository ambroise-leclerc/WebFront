name: Build time study

# Measurements for #435, run by hand: each job times one configuration of the tests under the compiler-cache scenarios of a
# pull request (test/tools/BuildStudy.py) and the report job tabulates them. Nothing here gates a merge.
on:
  # Temporary: a workflow absent from the default branch cannot be dispatched, so the study branch runs it on push.
  push:
    branches: [435-ci-build-time]
    paths: ['.github/workflows/BuildStudy.yml', 'test/tools/BuildStudy*.py']
  workflow_dispatch:
    inputs:
      variants:
        description: 'Comma-separated variants to run (empty: all)'
        default: ''

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          hash=$(sha256sum .github/docker/linux-ci.Dockerfile | cut -c1-16)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/linux-ci:$hash" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          REQUESTED: ${{ inputs.variants }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_variants = ['base-all-j2', 'base-all-j4', 'base-j2', 'base-j4', 'unity-heavy-b2',
                          'unity-heavy-b3', 'unity-heavy-b4', 'unity-heavy-b6', 'unity-heavy-b12', 'pch', 'pch-unity-heavy-b4',
                          'pch-unity-heavy-b12', 'unity-all-b16', 'noanalyze', 'noanalyze-pch', 'noanalyze-unity-heavy-b4',
                          'noanalyze-pch-unity-heavy-b4']
          import re
          tagged = re.search(r'\[variants:([^\]]*)\]', os.environ.get('MESSAGE', ''))  # a push selects variants this way
          requested = [v for v in (tagged.group(1) if tagged else os.environ.get('REQUESTED', '')).replace(' ', '').split(',') if v] or all_variants
          # /analyze exists on MSVC only: its variants have no Linux counterpart.
          reps = re.search(r'\[windows-reps:(\d+)\]', os.environ.get('MESSAGE', ''))
          # Hosted Windows runners vary a lot from one job to the next: repeat there, Linux is stable.
          linux = re.search(r'\[linux-reps:(\d+)\]', os.environ.get('MESSAGE', ''))
          count = {'windows': int(reps.group(1)) if reps else 1, 'linux': int(linux.group(1)) if linux else 1}
          include = [{'os': o, 'variant': v, 'rep': r} for v in requested for o in ('windows', 'linux') for r in range(1, count[o] + 1)
                     if not (o == 'linux' and v.startswith('noanalyze'))]
          print('matrix=' + json.dumps({'include': include}))
          PY

  study:
    needs: image
    # A commit message with [profile-only] skips the measurements and runs only the profile job.
    if: ${{ !contains(github.event.head_commit.message, '[profile-only]') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    name: ${{ matrix.os }} ${{ matrix.variant }} #${{ matrix.rep }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-2025' || 'ubuntu-26.04' }}
    container: ${{ matrix.os == 'linux' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}},"options":"--shm-size=1g"}}', needs.image.outputs.image, github.actor, github.token)) || '' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/remove-node
      - uses: ./.github/actions/setup-cmake
        with:
          version: '4.4.4'
      - name: Point the CPM cache at the workspace
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/.cache/CPM" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-study-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/unit/CMakeLists.txt') }}
          restore-keys: cpm-study-${{ runner.os }}-
      - name: Initialize MSVC environment
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Local-disk compiler cache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-study" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=20G" >> "$GITHUB_ENV"
      - name: Machine
        shell: bash
        run: |
          cmake --version | head -1
          (nproc || sysctl -n hw.ncpu || echo "$NUMBER_OF_PROCESSORS") 2>/dev/null
          (cl 2>&1 | head -1) || g++ --version | head -1
      - name: Measure
        shell: bash
        run: |
          v="${{ matrix.variant }}"
          case "$v" in
            base-all-j2)        jobs=2; target=all;   extra="" ;;
            base-all-j4)        jobs=4; target=all;   extra="" ;;
            base-j2)            jobs=2; target=tests; extra="" ;;
            base-j4)            jobs=4; target=tests; extra="" ;;
            pch)                jobs=4; target=tests; extra="-DWEBFRONT_TEST_PCH=ON" ;;
            noanalyze)          jobs=4; target=tests; extra="-DWEBFRONT_MSVC_ANALYZE=OFF" ;;
            noanalyze-pch)      jobs=4; target=tests; extra="-DWEBFRONT_MSVC_ANALYZE=OFF -DWEBFRONT_TEST_PCH=ON" ;;
            noanalyze-unity-heavy-b4)     jobs=4; target=tests; extra="-DWEBFRONT_MSVC_ANALYZE=OFF -DWEBFRONT_TEST_UNITY_BATCH=4 -DWEBFRONT_TEST_UNITY_HEAVY=ON" ;;
            noanalyze-pch-unity-heavy-b4) jobs=4; target=tests; extra="-DWEBFRONT_MSVC_ANALYZE=OFF -DWEBFRONT_TEST_PCH=ON -DWEBFRONT_TEST_UNITY_BATCH=4 -DWEBFRONT_TEST_UNITY_HEAVY=ON" ;;
            unity-heavy-b*)     jobs=4; target=tests; extra="-DWEBFRONT_TEST_UNITY_BATCH=${v#unity-heavy-b} -DWEBFRONT_TEST_UNITY_HEAVY=ON" ;;
            pch-unity-heavy-b*) jobs=4; target=tests; extra="-DWEBFRONT_TEST_PCH=ON -DWEBFRONT_TEST_UNITY_BATCH=${v#pch-unity-heavy-b} -DWEBFRONT_TEST_UNITY_HEAVY=ON" ;;
            unity-all-b*)       jobs=4; target=tests; extra="-DWEBFRONT_TEST_UNITY_BATCH=${v#unity-all-b}" ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          if [ "${{ matrix.os }}" = windows ]; then
            config=Release
            platform="-DWEBFRONT_EMBED_WEBVIEW2=ON -DWEBFRONT_WEBTEST_FRONTEND=WebView2"
          else
            config=Debug
            platform="-DWEBFRONT_EMBED_WEBKITGTK=ON -DWEBFRONT_WEBTEST_FRONTEND=WebKitGTK -DENABLE_COVERAGE=ON -DWEBFRONT_REQUIRE_REFLECTION_TESTS=ON"
          fi
          # shellcheck disable=SC2086
          python3 test/tools/BuildStudy.py --name "${{ matrix.os }}-${{ matrix.variant }}" --build-dir study/build \
            --jobs "$jobs" --target "$target" --config "$config" --rep ${{ matrix.rep }} --output "study/${{ matrix.os }}-${{ matrix.variant }}-r${{ matrix.rep }}.json" \
            -- $platform $extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-${{ matrix.os }}-${{ matrix.variant }}-r${{ matrix.rep }}
          path: study/*.json
          if-no-files-found: ignore

  # Where does the compile time of one heavy unit go? MSVC /d1reportTime, GCC -ftime-report, Clang -ftime-trace.
  profile:
    needs: image
    if: ${{ !contains(github.event.head_commit.message, '[variants:') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, macos]
    name: profile ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-2025' || matrix.os == 'macos' && 'macos-26' || 'ubuntu-26.04' }}
    container: ${{ matrix.os == 'linux' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}},"options":"--shm-size=1g"}}', needs.image.outputs.image, github.actor, github.token)) || '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/remove-node
      - uses: ./.github/actions/setup-cmake
        with:
          version: '4.4.4'
      - name: Point the CPM cache at the workspace
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/.cache/CPM" >> "$GITHUB_ENV"
      - name: Initialize MSVC environment
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Setup Xcode
        if: matrix.os == 'macos'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest
      - name: Profile the compilation
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows) flags="-d1reportTime"; config=Release ;;
            linux)   flags="-ftime-report"; config=Debug ;;
            macos)   flags="-ftime-trace -ftime-trace-granularity=2000"; config=Release ;;
          esac
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$config -DENABLE_TESTING=ON -DWEBFRONT_EMBED_CEF=OFF \
            -DENABLE_CACHE=OFF -DCMAKE_CXX_SCAN_FOR_MODULES=OFF "-DCMAKE_CXX_FLAGS=$flags"
          mkdir -p profile
          # One minimal application (HelloWorld) and the two heaviest units of the tests, one at a time (-j1: clean timings).
          for object in examples/CMakeFiles/HelloWorld.dir/hello-world/HelloWorld.cpp test/unit/CMakeFiles/tests.dir/WebFrontTests.cpp test/unit/CMakeFiles/tests.dir/DeveloperTests.cpp; do
            suffix=o; [ "${{ matrix.os }}" = windows ] && suffix=obj
            name=$(basename "$object")
            ( cd build && ninja -j1 -v "$object.$suffix" ) > "profile/$name.log" 2>&1 || tail -n 30 "profile/$name.log"
          done
          find build -name '*.json' -path '*CMakeFiles*' -newer build/CMakeCache.txt -exec cp {} profile/ \; 2>/dev/null || true
          ls -la profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.os }}
          path: profile/
          if-no-files-found: ignore

  report:
    needs: study
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[profile-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: study-*
          path: study-results
          merge-multiple: true
      - name: Tabulate
        run: python3 test/tools/BuildStudyReport.py study-results | tee -a "$GITHUB_STEP_SUMMARY" > study-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: study-report
          path: |
            study-report.md
            study-results/
