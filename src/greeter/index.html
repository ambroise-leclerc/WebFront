<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebFront Greeter</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 28rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  input { flex: 1 1 12rem; padding: 0.5rem; font: inherit; }
  button { padding: 0.5rem 1rem; font: inherit; }
  #result[data-state="error"] { color: #cf222e; }
</style>
</head>
<body>
<main>
  <h1>WebFront Greeter</h1>
  <p id="status" role="status" aria-live="polite">Connecting&hellip;</p>
  <form id="greeter-form">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="off" disabled>
    <button id="greet" type="submit" disabled>Greet</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
</main>
<script src="WebFront.js"></script>
<script type="module" src="greeter.mjs"></script>
</body>
</html>
