<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFront ES Modules Demo</title>
    <script src="WebFront.js"></script>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
        }
        .panel {
            width: min(90vw, 38rem);
            padding: 2rem;
            border-radius: 1rem;
            background: #111827;
            box-shadow: 0 1.5rem 4rem rgba(15, 23, 42, 0.35);
        }
        h1 {
            margin-top: 0;
        }
        p {
            color: #cbd5e1;
            line-height: 1.5;
        }
        .stack {
            display: grid;
            gap: 0.75rem;
        }
        input,
        button {
            font: inherit;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
        }
        input {
            background: #020617;
            color: inherit;
        }
        button {
            cursor: pointer;
            background: #4f46e5;
            color: white;
        }
        .status {
            min-height: 1.5rem;
            color: #93c5fd;
        }
        .module-note {
            font-size: 0.95rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="modules/main.mjs"></script>
</body>
</html>
